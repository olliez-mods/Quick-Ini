[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quick_ini"
version = "4.3"
description = "A library for reading from and writing to .ini formatted files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OllieZ-Mods", email = "socksinthewash@gmail.com" }]
requires-python = ">=3.10"
keywords = ["ini", "config", "configuration", "parser", "file"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
quick-ini = "quick_ini.__main__:main"

[project.urls]
Homepage = "https://github.com/olliez-mods/Quick-Ini"
"Bug Reports" = "https://github.com/olliez-mods/Quick-Ini/issues"
Source = "https://github.com/olliez-mods/Quick-Ini"

[tool.setuptools]
packages = ["quick_ini"]

[tool.setuptools.package-data]
quick_ini = ["py.typed"]
