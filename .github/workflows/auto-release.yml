name: CI & Release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: python -m unittest discover tests

  check-version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      released: ${{ steps.check.outputs.released }}

    steps:
      - uses: actions/checkout@v4

      # Release whenever pyproject.toml's version has no matching tag yet
      - name: Check for existing release tag
        id: check
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION already released"
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "v$VERSION not released yet"
            echo "released=false" >> $GITHUB_OUTPUT
          fi

  release:
    needs: [test, check-version]
    if: needs.check-version.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the GitHub release and tag
      id-token: write # PyPI trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history and tags, for release notes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build package
        run: |
          pip install build
          python -m build

      # Publish before tagging, so a failed upload is retried on the next push
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Generate release notes from commits
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"

          # Commits since the last tag (or all if no tags)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s")
          else
            COMMITS=$(git log --pretty=format:"- %s")
          fi

          cat > release_notes.md << EOF
          ## What's Changed in v${VERSION}

          ${COMMITS}

          ## Installation
          \`\`\`bash
          pip install quick_ini==${VERSION}
          \`\`\`
          EOF

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body_path: release_notes.md
