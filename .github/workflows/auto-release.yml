name: Auto Release on Version Change

on:
  push:
    branches: [master]

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.check.outputs.changed }}
      new-version: ${{ steps.check.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get full history

      - name: Check if version changed
        id: check
        run: |
          # Get current version from setup.py
          CURRENT_VERSION=$(grep -o 'version="[^"]*"' setup.py | cut -d'"' -f2)
          echo "Current version: $CURRENT_VERSION"

          # Get previous version from the last commit
          git checkout HEAD~1 -- setup.py 2>/dev/null || echo "No previous setup.py"
          if [ -f setup.py ]; then
            PREVIOUS_VERSION=$(grep -o 'version="[^"]*"' setup.py | cut -d'"' -f2 2>/dev/null || echo "0.0.0")
          else
            PREVIOUS_VERSION="0.0.0"
          fi
          echo "Previous version: $PREVIOUS_VERSION"

          # Restore current setup.py
          git checkout HEAD -- setup.py

          # Check if version changed
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          fi

  test:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Notify Tests Started
        if: matrix.python-version == '3.8' # Only notify once, not for each Python version
        run: |
          curl -H "Title: 🧪 Tests Started" \
               -H "Tags: test_tube" \
               -d "Quick-Ini v${{ needs.check-version.outputs.new-version }}" \
               ${{ vars.NTFY_URL }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: |
          python -m unittest discover tests

  notify-test-result:
    needs: [check-version, test]
    if: always() && needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Notify Tests Passed
        if: needs.test.result == 'success'
        run: |
          curl -H "Title: ✅ Tests Passed" \
               -H "Tags: white_check_mark" \
               -d "Quick-Ini v${{ needs.check-version.outputs.new-version }}" \
               ${{ vars.NTFY_URL }}

      - name: Notify Tests Failed
        if: needs.test.result == 'failure'
        run: |
          curl -H "Title: ❌ Tests Failed" \
               -H "Tags: x" \
               -H "Priority: high" \
               -d "Quick-Ini v${{ needs.check-version.outputs.new-version }}" \
               ${{ vars.NTFY_URL }}

  auto-release:
    needs: [check-version, test]
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Notify Release Start
        run: |
          curl -H "Title: 🚀 Release Started" \
               -H "Tags: rocket" \
               -d "Quick-Ini v${{ needs.check-version.outputs.new-version }}" \
               ${{ vars.NTFY_URL }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Generate release notes from commits
        id: release-notes
        run: |
          VERSION="${{ needs.check-version.outputs.new-version }}"

          # Get commits since last tag (or all if no tags)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline --pretty=format:"- %s")
          else
            COMMITS=$(git log --oneline --pretty=format:"- %s")
          fi

          # Create release notes
          cat > release_notes.md << EOF
          ## What's Changed in v${VERSION}

          ${COMMITS}

          ## Installation
          \`\`\`bash
          pip install quick_ini==${VERSION}
          \`\`\`

          **Full Changelog**: https://github.com/olliez-mods/Quick-Ini/compare/${LAST_TAG:-$(git rev-list --max-parents=0 HEAD)}...v${VERSION}
          EOF

          echo "Generated release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check-version.outputs.new-version }}
          release_name: v${{ needs.check-version.outputs.new-version }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Notify Release Success
        if: success()
        run: |
          curl -H "Title: ✅ Released" \
               -H "Tags: white_check_mark" \
               -d "Quick-Ini v${{ needs.check-version.outputs.new-version }}" \
               ${{ vars.NTFY_URL }}

      - name: Notify Release Failure
        if: failure()
        run: |
          curl -H "Title: ❌ Release Failed" \
               -H "Tags: x" \
               -H "Priority: high" \
               -d "Quick-Ini v${{ needs.check-version.outputs.new-version }}" \
               ${{ vars.NTFY_URL }}
